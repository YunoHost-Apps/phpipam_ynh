packaging_format = 2

id = "phpipam"
name = "phpIPAM"
description.en = "Web IP address management application"
description.fr = "Application web de gestion d'adresses IP"

version = "1.19.008~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://phpipam.net"
demo = "http://demo.phpipam.net"
admindoc = "https://phpipam.net/documents/"
code = "https://github.com/phpipam/phpipam"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/phpipam"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/phpipam/phpipam/archive/refs/tags/v1.8.1.tar.gz"
        sha256 = "32655c04761e4732a68636bbde4a762eef453e8d6df67f2126f565d283187fe0"
        autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.show_tile = false
    api.allowed = "visitors"

    [resources.apt]
    packages = "mariadb-server, php8.3-gmp, php8.3-mysql, php8.3-ldap, php8.3-gd, php8.3-opcache, php8.3-fileinfo, php8.3-intl, php8.3-cli, php8.3-mbstring, php8.3-xml, php-pear, php8.3-curl"

    [resources.database]
    type = "mysql"
