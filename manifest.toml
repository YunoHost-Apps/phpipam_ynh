packaging_format = 2

id = "phpipam"
name = "phpIPAM"
description.en = "Web IP address management application"
description.fr = "Application web de gestion d'adresses IP"

version = "1.19.008~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-only"
website = "https://phpipam.net"
demo = "http://demo.phpipam.net"
admindoc = "https://phpipam.net/documents/"
code = "https://github.com/phpipam/phpipam"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/phpipam"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/phpipam/phpipam/releases/download/v1.8.3/phpipam-v1.8.3.tgz"
        sha256 = "2fc737da5a04a842cda097f609c4db85c808270eaad5949c4ec03d10f874556d"
        autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.show_tile = false
    api.allowed = "visitors"

    [resources.apt]
    packages = "mariadb-server, php-pear, php8.5-gmp, php8.5-curl, php8.5-mysql, php8.5-ldap, php8.5-gd, php8.5-common, php8.5-fileinfo, php8.5-intl, php8.5-cli, php8.5-mbstring, php8.5-xml"

    [resources.database]
    type = "mysql"
